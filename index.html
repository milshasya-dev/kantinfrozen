<script>
  // === JEMBATAN FETCH KE GOOGLE APPS SCRIPT (AGAR BISA DI GITHUB PAGES) ===
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw6QStRznf5FIEcvHJn_GIRkKxx0-eN_jEPX0RyF3dq32J5GkpMRHJ93pMAvq0ElMH20Q/exec";

  if (typeof google === 'undefined' || !google.script) {
    window.google = {
      script: {
        run: (function() {
          function createRunner(onSuccess, onFailure) {
            return new Proxy({}, {
              get: function(_, funcName) {
                if (funcName === 'withSuccessHandler') {
                  return function(cb) { return createRunner(cb, onFailure); };
                }
                if (funcName === 'withFailureHandler') {
                  return function(cb) { return createRunner(onSuccess, cb); };
                }
                return function(...args) {
                  fetch(GAS_API_URL + "?t=" + Date.now(), {
                    method: 'POST',
                    cache: 'no-store',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: funcName, args: args })
                  })
                  .then(res => res.json())
                  .then(res => {
                    if (res.status === 'ok') {
                      if (onSuccess) onSuccess(res.data);
                    } else {
                      if (onFailure) onFailure(new Error(res.message || 'Error server'));
                    }
                  })
                  .catch(err => {
                    if (onFailure) onFailure(err);
                  });
                };
              }
            });
          }
          return createRunner(null, null);
        })()
      }
    };
  }
(function(){
  function applyMobileScale(){
    try {
      var ua = navigator.userAgent || '';
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) ||
                     (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
      var docEl = document.documentElement;
      var vw = window.innerWidth || docEl.clientWidth || 360;
      if (isMobile) {
        docEl.classList.add('is-mobile');
        if (vw > 540 && window.screen && Math.min(window.screen.width, window.screen.height) <= 600) {
          var scale = Math.min(2.6, Math.max(1.2, vw / 390));
          docEl.style.zoom = scale.toFixed(3);
        } else {
          docEl.style.zoom = '';
        }
      } else {
        docEl.classList.remove('is-mobile');
        docEl.style.zoom = '';
      }
    } catch(e){}
  }
  applyMobileScale();
  window.addEventListener('DOMContentLoaded', applyMobileScale, {passive:true});
  window.addEventListener('resize', applyMobileScale, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(applyMobileScale, 150); }, {passive:true});
})();
</script>

<script>
const today = new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
let role='admin', page='dashboard', searchTerm='', categoryFilter='Semua kategori', cart=[], auditSaved=false, lastAuditDate='', auditOwner='', auditReopenReason='', currentUser=null, reportPreviewOpen=false;

// Penyimpanan Draft Ketikan Audit agar ketika di-scroll ke bawah yang atas tidak pernah kembali ke 0
let auditDrafts = {};

// Variabel Kendali Sinkronisasi Otomatis Antar Device
let dataLoaded=false, saveTimer=null, savingNow=false, pullingNow=false, lastSaveCompletedAt=0, syncLockUntil=0, lastServerSignature='';

let categories=[];
let products=[];
let requests=[];
let users=[{id:1,name:'Admin',role:'Admin',status:'Aktif'}];
let transactions=[];
const rupiah=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');

// Helper Escape HTML
function escHtml(str){
 return String(str ?? '')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;');
}

// Mencegah angka pada <input type="number"> berubah sendiri saat jari melakukan scroll layar di HP
document.addEventListener('wheel', function(e){
 if(document.activeElement && document.activeElement.type === 'number'){
  document.activeElement.blur();
 }
}, {passive:true});

function normalizeItemName(str){
 return String(str||'').replace(/\s*\[QTY:\s*\d+\]/gi,'').trim().replace(/\s+/g,' ').toLowerCase();
}
function findExistingProductByName(name, excludeId=null){
 const norm = normalizeItemName(name);
 if(!norm) return null;
 return products.find(p => (excludeId===null || Number(p.id)!==Number(excludeId)) && normalizeItemName(p.name) === norm) || null;
}

// Helper untuk mengambil daftar seluruh kategori secara berurutan
function getAllCategoryNames(){
 return [...new Set([...categories.map(c=>c.name), ...products.map(p=>p.category).filter(Boolean)])];
}

// Helper untuk mengelompokkan & mengurutkan barang sesuai kategori dan abjad nama barang (A-Z)
function getProductsGroupedByCategory(sourceList = products){
 const catOrder = getAllCategoryNames();
 const groups = [];

 catOrder.forEach(catName => {
  const items = sourceList
   .filter(p => (p.category || 'Lainnya') === catName)
   .slice()
   .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'id', {sensitivity: 'base'}));
  if(items.length > 0){
   groups.push({ category: catName, items });
  }
 });

 // Jika ada barang dengan kategori kosong / di luar daftar
 const uncategorized = sourceList
  .filter(p => !catOrder.includes(p.category || 'Lainnya'))
  .slice()
  .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'id', {sensitivity: 'base'}));
 if(uncategorized.length > 0){
  groups.push({ category: 'Lainnya', items: uncategorized });
 }

 return groups;
}

// Helper untuk mendapatkan array datar barang yang sudah terurut per kategori lalu abjad (A-Z)
function getProductsSortedByCategory(sourceList = products){
 const groups = getProductsGroupedByCategory(sourceList);
 const result = [];
 groups.forEach(g => result.push(...g.items));
 return result;
}

function getRequestQty(r){
 if(!r) return 1;
 const directCandidates = [r.quantity, r.qty, r.opening, r.stock, r.jumlah];
 for(const val of directCandidates){
  const num = Number(val);
  if(Number.isFinite(num) && num > 1) return Math.floor(num);
 }
 const matchName = String(r.name||'').match(/\[QTY:\s*(\d+)\]/i);
 if(matchName && Number(matchName[1]) > 0) return Math.floor(Number(matchName[1]));
 const matchBy = String(r.requestedBy||'').match(/\(Qty:\s*(\d+)\)/i);
 if(matchBy && Number(matchBy[1]) > 0) return Math.floor(Number(matchBy[1]));
 for(const val of directCandidates){
  const num = Number(val);
  if(Number.isFinite(num) && num >= 1) return Math.floor(num);
 }
 return 1;
}
function getCleanRequestName(r){
 return String(r?.name||'').replace(/\s*\[QTY:\s*\d+\]/gi,'').trim();
}
function getCleanRequestedBy(r){
 return String(r?.requestedBy||'Kasir').replace(/\s*\(Qty:\s*\d+\)/gi,'').trim();
}
function normalizeRequestsList(list){
 return (list||[]).map(r=>{
  const trueQty = getRequestQty(r);
  const cleanName = getCleanRequestName(r);
  const cleanBy = getCleanRequestedBy(r);
  return {
   ...r,
   id: Number(r.id)||Date.now(),
   name: `${cleanName} [QTY:${trueQty}]`,
   requestedBy: `${cleanBy} (Qty: ${trueQty})`,
   price: Math.max(0, Math.floor(Number(r.price)||0)),
   quantity: trueQty,
   qty: trueQty,
   opening: trueQty
  };
 });
}
function normalizeProductsList(list){
 return (list||[]).map(p=>{
  const opening = Math.max(0, Math.floor(Number(p.opening)||0));
  const incoming = Math.max(0, Math.floor(Number(p.incoming)||0));
  const posSold = Math.max(0, Math.floor(Number(p.posSold)||0));
  const archivedSold = Math.max(0, Math.floor(Number(p.archivedSold)||0));
  const maxStock = opening + incoming;
  const theoRem = Math.max(0, maxStock - posSold);
  const rawRem = (p.remaining !== undefined && p.remaining !== null && p.remaining !== '')
   ? Math.floor(Number(p.remaining))
   : theoRem;
  const remaining = Math.max(0, Math.min(maxStock, Number.isFinite(rawRem) ? rawRem : theoRem));
  return {
   ...p,
   id: Number(p.id)||0,
   name: getCleanRequestName(p),
   price: Math.max(0, Math.floor(Number(p.price)||0)),
   opening,
   incoming,
   posSold,
   archivedSold,
   remaining
  };
 });
}

function snapshotData(){
 requests = normalizeRequestsList(requests);
 products = normalizeProductsList(products);
 return {
  categories,
  products,
  requests,
  users:users.filter(u=>u.role!=='Admin'),
  transactions,
  auditSaved,
  lastAuditDate,
  auditOwner,
  auditReopenReason
 };
}

function buildDataSignature(d){
 if(!d) return '';
 return JSON.stringify({
  c:d.categories||[],
  p:normalizeProductsList(d.products||[]),
  r:normalizeRequestsList(d.requests||[]),
  u:(d.users||[]).map(x=>({id:x.id,name:x.name,role:x.role,status:x.status,pw:x.password?String(x.password).length:0})),
  t:d.transactions||[],
  as:!!d.auditSaved,
  lad:d.lastAuditDate||'',
  ao:d.auditOwner||'',
  arr:d.auditReopenReason||''
 });
}

function setSyncStatus(isBusy, labelText){
 const badge=document.getElementById('syncBadge');
 const txt=document.getElementById('syncText');
 if(badge) badge.classList.toggle('syncing', !!isBusy);
 if(txt && labelText) txt.textContent=labelText;
}

function queueSave(){
 if(!dataLoaded) return;
 syncLockUntil = Date.now() + 5000;
 const snap = snapshotData();
 lastServerSignature = buildDataSignature(snap);
 clearTimeout(saveTimer);
 setSyncStatus(true, 'Menyimpan...');
 saveTimer=setTimeout(()=>{
  savingNow=true;
  syncLockUntil = Date.now() + 5000;
  const payload=snapshotData();
  lastServerSignature=buildDataSignature(payload);
  google.script.run
   .withSuccessHandler(()=>{
    savingNow=false;
    lastSaveCompletedAt=Date.now();
    syncLockUntil=Date.now()+2500;
    setSyncStatus(false, 'Live');
   })
   .withFailureHandler(err=>{
    savingNow=false;
    setSyncStatus(false, 'Live');
    toast('Gagal menyimpan ke Database: '+(err.message||err));
   })
   .saveAppData(payload);
 }, 200);
}

function isUserBusyTyping(){
 const modalOpen = document.getElementById('modalBackdrop')?.classList.contains('show');
 if(modalOpen) return true;
 if(page === 'audit' && !auditSaved) return true;
 const active = document.activeElement;
 if(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT')){
  return true;
 }
 return false;
}

function mergeUsersFromServer(serverUsers){
 const localMap = {};
 users.forEach(u=>{ if(u.name) localMap[u.name.toLowerCase()] = u; });
 const merged = (serverUsers||[]).filter(u=>u.role!=='Admin').map(u=>{
  const prev = localMap[String(u.name||'').toLowerCase()];
  return {
   ...u,
   password: u.password || (prev ? prev.password : undefined)
  };
 });
 return [{id:1,name:'Admin',role:'Admin',status:'Aktif'}, ...merged];
}

function syncFromServer(forceManual=false){
 if(!dataLoaded) return;
 if(savingNow || saveTimer) return;
 if(!forceManual && (Date.now() < syncLockUntil || Date.now() - lastSaveCompletedAt < 3000)) return;
 if(!forceManual && isUserBusyTyping()) return;
 if(pullingNow) return;

 pullingNow=true;
 const pullStartedAt = Date.now();
 if(forceManual) setSyncStatus(true, 'Sinkron...');

 google.script.run
  .withSuccessHandler(data=>{
   pullingNow=false;
   setSyncStatus(false, 'Live');
   if(!data || savingNow || saveTimer || pullStartedAt < lastSaveCompletedAt || (!forceManual && Date.now() < syncLockUntil)) return;

   const incomingSig = buildDataSignature(data);
   if(incomingSig !== lastServerSignature){
    lastServerSignature = incomingSig;
    categories = data.categories || [];
    products = normalizeProductsList(data.products || []);
    if(data.auditSaved){
     auditDrafts = {};
    }
    requests = normalizeRequestsList(data.requests || []);
    users = mergeUsersFromServer(data.users || []);
    transactions = data.transactions || [];
    auditSaved = !!data.auditSaved;
    lastAuditDate = data.lastAuditDate || '';
    auditOwner = data.auditOwner || '';
    auditReopenReason = data.auditReopenReason || '';

    if(cart.length){
     cart = cart.map(c=>{
      const p = products.find(x=>x.id===c.id);
      if(!p) return null;
      const avail = Math.max(0, (Number(p.opening)||0)+(Number(p.incoming)||0)-(Number(p.posSold)||0));
      return avail > 0 ? {...c, name:p.name, price:p.price, qty:Math.min(c.qty, avail)} : null;
     }).filter(Boolean);
    }

    renderLoginUsers();
    if(currentUser){
     render(true);
    }
    if(forceManual){
     toast('Data berhasil disinkronkan.');
    }
   } else if(forceManual){
    toast('Data sudah paling baru.');
   }
  })
  .withFailureHandler(()=>{
   pullingNow=false;
   setSyncStatus(false, 'Live');
  })
  .getAppData();
}

function manualSyncNow(){
 syncFromServer(true);
}

setInterval(()=>{
 if(!document.hidden){
  syncFromServer(false);
 }
}, 4000);

document.addEventListener('visibilitychange', ()=>{
 if(!document.hidden && dataLoaded){
  syncFromServer(false);
 }
});
window.addEventListener('focus', ()=>{
 if(dataLoaded){
  syncFromServer(false);
 }
});

function loadDatabase(){
 document.getElementById('loginError').textContent='Menghubungkan ke Database...';
 google.script.run
  .withSuccessHandler(data=>{
   if(data){
    categories=data.categories||[];
    products=normalizeProductsList(data.products||[]);
    requests=normalizeRequestsList(data.requests||[]);
    users=mergeUsersFromServer(data.users||[]);
    transactions=data.transactions||[];
    auditSaved=!!data.auditSaved;
    lastAuditDate=data.lastAuditDate||'';
    auditOwner=data.auditOwner||'';
    auditReopenReason=data.auditReopenReason||'';
    lastServerSignature=buildDataSignature(data);
   }
   dataLoaded=true;
   renderLoginUsers();
   render(true);
   document.getElementById('loginError').textContent='';
  })
  .withFailureHandler(err=>{
   document.getElementById('loginError').textContent='Database tidak terhubung: '+(err.message||err);
  })
  .getAppData();
}

// =========================================================================
// PERHITUNGAN STOK & PENDAPATAN YANG KONSISTEN
// =========================================================================
const currentRemainingStock = p => {
 const maxAvail = Math.max(0, (Number(p.opening)||0) + (Number(p.incoming)||0));
 if(auditSaved){
  return Math.max(0, Math.min(maxAvail, Number(p.remaining)||0));
 }
 const rem = (p.remaining !== undefined && p.remaining !== null)
  ? Number(p.remaining)
  : (maxAvail - (Number(p.posSold)||0));
 return Math.max(0, Math.min(maxAvail, rem));
};

const soldByStock = p => Math.max(0, (Number(p.opening)||0) + (Number(p.incoming)||0) - currentRemainingStock(p));
const posRevenue = () => products.reduce((s,p)=>s+(Number(p.posSold)||0)*(Number(p.price)||0),0);
const stockRevenue = () => products.reduce((s,p)=>s+soldByStock(p)*(Number(p.price)||0),0);
const posUnits = () => products.reduce((s,p)=>s+(Number(p.posSold)||0),0);
const stockUnits = () => products.reduce((s,p)=>s+soldByStock(p),0);
const variance = () => stockRevenue()-posRevenue();

const productUnitDiff = p => soldByStock(p)-(Number(p.posSold)||0);
const productMoneyDiff = p => productUnitDiff(p)*(Number(p.price)||0);
const isProductLeaking = p => productUnitDiff(p)!==0;
const getLeakingProducts = () => getProductsSortedByCategory(products.filter(p=>isProductLeaking(p)));

const cumulativeSoldUnits = p => (Number(p.archivedSold)||0)+soldByStock(p);
const cumulativePosRevenue = () => products.reduce((s,p)=>s+cumulativeSoldUnits(p)*(Number(p.price)||0),0);
const cumulativePosUnits = () => products.reduce((s,p)=>s+cumulativeSoldUnits(p),0);

const isAuditRecord = t => t && String(t.id||'').startsWith('AUD-');
const regularTransactions = () => transactions.filter(t=>!isAuditRecord(t));
const auditHistoryRecords = () => transactions.filter(isAuditRecord).map(t=>{
 const parts=String(t.status||'').split('|');
 let leakItems=[], allItems=[];
 if(parts[4]){
  try{ leakItems=JSON.parse(decodeURIComponent(parts[4])); }catch(e){}
 }
 if(parts[5]){
  try{ allItems=JSON.parse(decodeURIComponent(parts[5])); }catch(e){}
 }
 return {
  id:t.id,
  date:t.time||'-',
  cashier:t.cashier||'Kasir',
  pos:Number(t.total)||0,
  stock:Number(parts[1])||0,
  diff:Number(parts[2])||0,
  units:Number(t.items)||0,
  note:parts[3]||'',
  leakItems,
  allItems
 };
});

 if(role==='cashier'&&!['pos','requests','audit'].includes(next)){next='pos';}

 page=next;searchTerm='';categoryFilter='Semua kategori';closeSidebar();
 render(true);

 if(role==='admin'&&page==='pos')page='dashboard';

function buildRemainingStockWhatsAppText(){
 const groups = getProductsGroupedByCategory(products);
 const statusTxt = auditSaved ? `Audit Terkunci (${auditOwner||'Kasir'})` : 'Estimasi Stok Aktif';
 let lines = [];
 lines.push(`*LAPORAN SISA STOK KANTIN MMU*`);
 lines.push(` ${today}`);
 lines.push(` Status: ${statusTxt}`);
 lines.push(`--------------------------------`);

 let totalAllUnits = 0;
 let totalOutItems = 0;

 if(!groups.length){
  lines.push(`_Belum ada data barang._`);
 } else {
  groups.forEach(group => {
   lines.push(``);
   lines.push(`* ${String(group.category).toUpperCase()}*`);
   let catUnits = 0;
   group.items.forEach((p, idx) => {
    const rem = currentRemainingStock(p);
    catUnits += rem;
    totalAllUnits += rem;
    if(rem === 0) totalOutItems++;
    const remLabel = rem === 0 ? `*0 (HABIS)* ` : `*${rem}*`;
    lines.push(`${idx + 1}. ${p.name} : ${remLabel}`);
   });
   lines.push(`_Subtotal ${group.category}: ${catUnits} unit_`);
  });
 }

 lines.push(``);
 lines.push(`--------------------------------`);
 lines.push(`*Total Jenis Barang:* ${products.length} jenis`);
 lines.push(`*Total Sisa Stok:* ${totalAllUnits} unit`);
 lines.push(`*Barang Habis (0):* ${totalOutItems} jenis`);

 return lines.join('\n');
}

function copyStockWAText(){

function normalizePhoneForWA(raw){
 let digits = String(raw || '').replace(/[^0-9]/g, '');
 if(!digits) return '';
 if(digits.startsWith('0')){
  digits = '62' + digits.slice(1);
 } else if(digits.startsWith('8')){
  digits = '62' + digits;
 }
 return digits;
}

function sendStockTextToWhatsApp(){
 const textEl = document.getElementById('waStockTextOutput');
 const phoneEl = document.getElementById('waTargetPhone');
 const message = textEl ? textEl.value : buildRemainingStockWhatsAppText();
 const rawPhone = phoneEl ? phoneEl.value.trim() : '';
 const cleanPhone = normalizePhoneForWA(rawPhone);

 try { localStorage.setItem('kantin_mmu_wa_phone', rawPhone); } catch(e){}

 // 1. Prioritas Bridge Native Android WebView jika tersedia
 if(window.Android && typeof window.Android.shareToWhatsApp === 'function'){
  window.Android.shareToWhatsApp(message, cleanPhone);
  return;
 }

 const encodedText = encodeURIComponent(message);
 const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');

 // 2. Gunakan skema whatsapp://send di HP/Android WebView agar langsung membuka aplikasi WhatsApp
 const directSchemeUrl = cleanPhone
  ? `whatsapp://send?phone=${cleanPhone}&text=${encodedText}`
  : `whatsapp://send?text=${encodedText}`;

 const webWaUrl = cleanPhone
  ? `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodedText}`
  : `https://api.whatsapp.com/send?text=${encodedText}`;

 if(isMobileDevice){
  window.location.href = directSchemeUrl;
 } else {
  window.open(webWaUrl, '_blank', 'noopener');
 }
}

function filterBulkDeleteModalList(q){
 const norm = String(q||'').trim().toLowerCase();
 document.querySelectorAll('#bulkDeleteListWrap .bulk-del-item').forEach(row=>{
  const txt = row.textContent.toLowerCase();
  row.style.display = (!norm || txt.includes(norm)) ? 'flex' : 'none';
 });
}

function selectBulkDeleteItems(mode){
 document.querySelectorAll('#bulkDeleteListWrap .bulk-del-cb').forEach(cb=>{
  const row = cb.closest('.bulk-del-item');
  const isVisible = !row || row.style.display !== 'none';
  if(mode === 'all' && isVisible) cb.checked = true;
  else if(mode === 'none') cb.checked = false;
  else if(mode === 'zero') cb.checked = (cb.dataset.zero === '1');
 });
 updateBulkDeleteCounter();
}

function updateBulkDeleteCounter(){
 const checked = document.querySelectorAll('#bulkDeleteListWrap .bulk-del-cb:checked').length;
 const info = document.getElementById('bulkDelSelectedInfo');
 const btn = document.getElementById('confirmBulkDelBtn');
 if(info) info.textContent = `${checked} barang dipilih`;
 if(btn){
  btn.textContent = `Hapus Terpilih (${checked})`;
  btn.disabled = checked === 0;
 }
}

function selectPosCategoryByIndex(idx){
 const allCats=['Semua kategori',...getAllCategoryNames()];
 categoryFilter = allCats[idx] || 'Semua kategori';
 render(true);
}

function posPage(){
 if(role==='admin')return dashboardPage();
 if(auditSaved)return `${pageHead('Checkout ditutup untuk shift ini','Audit sisa barang sudah disimpan dan dikunci. Hanya Admin yang dapat membuka kembali kunci untuk memulai hari/shift baru.',`<button class="btn btn-primary" onclick="go('audit')">Lihat hasil audit</button>`)}`;
 let list=getProductsSortedByCategory(products.filter(p=>(p.name.toLowerCase().includes(searchTerm.toLowerCase()))&&(categoryFilter==='Semua kategori'||p.category===categoryFilter)));
 let cartTotal=cart.reduce((s,c)=>s+c.qty*c.price,0),cartQty=cart.reduce((s,c)=>s+c.qty,0);
 const allCats=['Semua kategori',...getAllCategoryNames()];
 return `
 <div class="pos-layout">
  <div class="pos-left">
   <input id="productSearch" class="pos-search-input" placeholder="Cari barang..." value="${escHtml(searchTerm)}" oninput="searchTerm=this.value;render(true)" />
   <div class="cat-pills-row">
    ${allCats.map((cat,idx)=>`<button type="button" class="cat-pill ${categoryFilter===cat?'active':''}" onclick="selectPosCategoryByIndex(${idx})">${cat==='Semua kategori'?'Semua':escHtml(cat)}</button>`).join('')}
   </div>
   <div class="pos-grid">
    ${list.map(p=>{
     let available=Math.max(0,(Number(p.opening)||0)+(Number(p.incoming)||0)-(Number(p.posSold)||0));
     return `<button type="button" class="pos-product" onclick="addToCart(${p.id})" ${available===0?'disabled':''}>
      <div class="pos-prod-title">${escHtml(p.name)}</div>
      <div class="pos-prod-price">${rupiah(p.price)}</div>
      ${available<=5?`<div class="pos-prod-stock">Stok: ${available}</div>`:''}
     </button>`;
    }).join('')||'<div class="empty-state" style="grid-column:1/-1">Barang tidak ditemukan.</div>'}
   </div>
  </div>
  <aside class="cart-panel ${cart.length?'has-items':'is-empty'}">
   <div class="cart-head">
    <div class="cart-head-title">
     <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
     <span>Keranjang ${cartQty?`(${cartQty})`:''}</span>
    </div>
    ${cart.length?`<button class="btn btn-small" onclick="clearCart()">Kosongkan</button>`:''}
   </div>
   <div class="cart-items-wrap">
    ${cart.length?cart.map(c=>`<div class="cart-item">
     <div class="cart-info"><strong>${escHtml(c.name)}</strong><small>${rupiah(c.price)} / item</small></div>
     <div class="qty-control"><button type="button" onclick="changeCart(${c.id},-1)">-</button><b>${c.qty}</b><button type="button" onclick="changeCart(${c.id},1)">+</button></div>
     <strong class="money">${rupiah(c.qty*c.price)}</strong>
    </div>`).join(''):'<div class="cart-empty">Keranjang kosong</div>'}
   </div>
   <div class="cart-footer">
    <div class="cart-total"><span>Total</span><strong>${rupiah(cartTotal)}</strong></div>
    <button class="checkout-btn" onclick="checkout()" ${cart.length?'':'disabled'}>Bayar</button>
   </div>
  </aside>
 </div>`;
}

function productsPage(){
 let low=products.filter(p=>currentRemainingStock(p)<=5).length;
 let emptyCount=products.filter(p=>currentRemainingStock(p)===0).length;
 const allCatNames=getAllCategoryNames();
 const filtered=products.filter(p=>(p.name.toLowerCase().includes(searchTerm.toLowerCase()))&&(categoryFilter==='Semua kategori'||p.category===categoryFilter));
 return `${pageHead('Barang & Stok','Daftar barang aktif, harga jual, dan sisa stok terakhir.',`${role==='admin'?`<button class="btn btn-wa" onclick="exportRemainingStockWA()">Kirim Sisa Stok (WA)</button><button class="btn btn-success" onclick="exportRemainingStockPDF()"> Export PDF Sisa Barang</button><button class="btn btn-danger" onclick="openBulkDeleteProductsModal()">Hapus Beberapa</button><button class="btn btn-danger" onclick="deleteEmptyStockProductsPrompt()">Hapus Stok Habis (${emptyCount})</button><button class="btn btn-primary" onclick="newProduct()">+ Tambah / Stok Barang</button>`:'<button class="btn btn-primary" onclick="newProductRequest()">+ Ajukan barang</button>'}`)}<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">${stat('Total produk',products.length+' jenis','','si-blue','Produk yang sudah disetujui')}${stat('Kategori aktif',categories.length+' kategori','','si-teal','Pengelompokan barang toko')}${stat('Stok rendah / habis',low+' jenis','!','si-amber','Sisa stok  5 unit')}</div><div class="simple-panel"><div class="panel-head"><div><h2>Daftar barang</h2><div class="panel-sub">Diurutkan sesuai kategori dan abjad nama barang</div></div><div class="section-tools"><input id="productSearch" class="search" placeholder="Cari nama barang..." value="${escHtml(searchTerm)}" oninput="searchTerm=this.value;render(true)"/><select class="filter-select" onchange="categoryFilter=this.value;render(true)"><option value="Semua kategori">Semua kategori</option>${allCatNames.map(cName=>`<option value="${escHtml(cName)}" ${categoryFilter===cName?'selected':''}>${escHtml(cName)}</option>`).join('')}</select></div></div><div class="table-wrap table-box-scroll"><table class="table"><thead><tr><th>Nama barang</th><th>Kategori</th><th>Harga jual</th><th>Stok awal + masuk</th><th>Terjual (Shift ini)</th><th>Sisa Stok</th><th>Kondisi</th><th></th></tr></thead><tbody>${productTableRows(filtered)||'<tr><td colspan="8" class="empty-state">Tidak ada barang ditemukan.</td></tr>'}</tbody></table></div></div>`;
}

function categoriesPage(){
 return `${pageHead('Kategori Barang','Kategori disajikan ringkas agar mudah dibaca.',`${role==='admin'?'<button class="btn btn-primary" onclick="newCategory()">+ Tambah kategori</button>':''}`)}<div class="simple-panel"><div class="panel-head"><div><h2>Daftar kategori</h2><div class="panel-sub">${categories.length} kategori tersedia</div></div></div><div class="category-card-grid">${categories.map((c, idx)=>`<div class="category-card"><div><div class="category-name">${escHtml(c.name)}</div><div class="category-count">${products.filter(p=>p.category===c.name).length} jenis barang</div></div>${role==='admin'?`<div class="tag-row"><button class="icon-btn" title="Ubah kategori" onclick="editCategoryByIndex(${idx})"></button><button class="btn btn-small btn-danger" title="Hapus kategori" onclick="deleteCategoryByIndex(${idx})">Hapus</button></div>`:''}</div>`).join('')||'<div class="empty-state" style="grid-column:1/-1">Belum ada kategori.</div>'}</div></div>`;
}

function getAuditPreviewRemaining(p){
 const available = (Number(p.opening)||0) + (Number(p.incoming)||0);
 if(!auditSaved && auditDrafts[p.id] !== undefined && String(auditDrafts[p.id]).trim() !== ''){
  return Math.max(0, Math.min(available, Math.floor(Number(auditDrafts[p.id])||0)));
 }
 return currentRemainingStock(p);
}

// =========================================================================
// HALAMAN RIWAYAT / AUDIT DENGAN URUTAN BARANG SESUAI TIAP KATEGORI (A-Z)
// =========================================================================
function auditPage(){
 let previewStockRev = 0, previewStockUnits = 0, previewLeakingCount = 0;
 products.forEach(p=>{
  const avail = (Number(p.opening)||0) + (Number(p.incoming)||0);
  const rem = getAuditPreviewRemaining(p);
  const sold = Math.max(0, avail - rem);
  previewStockUnits += sold;
  previewStockRev += sold * (Number(p.price)||0);
  if(sold - (Number(p.posSold)||0) !== 0) previewLeakingCount++;
 });
 let diff = previewStockRev - posRevenue();
 let leakingItems = getLeakingProducts();
 const status=auditSaved ? `<span class="pill pill-green">Audit terkunci</span>` : `<span class="pill pill-yellow">Menunggu audit</span>`;
 const actions=auditSaved
 ? (role==='admin'
    ? `<button class="btn btn-small btn-primary" onclick="startNewDayPrompt()">Mulai Hari / Shift Baru</button><button class="btn btn-small btn-danger" onclick="reopenAuditPrompt()">Koreksi Audit Ini</button>`
    : status)
 : status;
 const lockedNotice=auditSaved
 ? `<div class="notice"><div><strong>Audit shift ini sudah disimpan dan Checkout terkunci.</strong><br>Disimpan oleh <strong>${escHtml(auditOwner||'Kasir')}</strong> pada ${escHtml(lastAuditDate||'hari ini')}. ${leakingItems.length?`<span style="color:#fca5a5;font-weight:700">Terdapat ${leakingItems.length} barang yang bocor/selisih (ditandai kotak warna merah).</span>`:'<span style="color:#4ade80;font-weight:700">Semua stok barang cocok dan aman.</span>'} ${role==='admin'?'<br>Klik <strong>"Mulai Hari / Shift Baru"</strong> untuk menyimpan hasil kasir ini ke riwayat harian dan membuka checkout mulai dari Rp 0 untuk kasir berikutnya.':''}</div></div>`
 : `<div class="notice"><div><strong>Hitungan khusus untuk shift kasir saat ini.</strong><br>Daftar barang di bawah telah <strong>dikelompokkan dan diurutkan sesuai tiap kategori (A–Z)</strong> agar mudah dicocokkan dengan etalase. Angka yang Anda ketik otomatis tersimpan sebagai draft dan tidak akan hilang saat layar di-scroll. ${auditReopenReason?`<br><strong>Catatan koreksi oleh admin:</strong> ${escHtml(auditReopenReason)}`:''}</div></div>`;

 // Mengelompokkan barang berdasarkan kategori dan mengurutkan nama barang secara alfabetis (A-Z)
 const groupedProducts = getProductsGroupedByCategory(products);

 const groupedProductsHtml = groupedProducts.length ? groupedProducts.map(group => {
  const cardsHtml = group.items.map(p => {
   const available=(Number(p.opening)||0)+(Number(p.incoming)||0);
   const previewRem = getAuditPreviewRemaining(p);
   const previewSold = Math.max(0, available - previewRem);
   const unitDiff = productUnitDiff(p);
   const moneyDiff = productMoneyDiff(p);
   const displayVal = (!auditSaved && auditDrafts[p.id] !== undefined) ? auditDrafts[p.id] : currentRemainingStock(p);
   const isRedBox = auditSaved && unitDiff !== 0;
   let leakText = '';
   if(isRedBox){
    if(unitDiff > 0){
     leakText = ` BOCOR ${unitDiff} unit (${rupiah(moneyDiff)}) — Fisik berkurang tanpa di-checkout`;
    } else {
     leakText = ` SELISIH LEBIH ${Math.abs(unitDiff)} unit (${rupiah(moneyDiff)}) — Checkout melebihi fisik keluar`;
    }
   }
   return `<article class="audit-product-card ${isRedBox?'is-leaking':''}">
   <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
    <div>
     <div class="audit-product-name">${escHtml(p.name)}</div>
     <div class="audit-product-sku">${escHtml(p.category)} · ${rupiah(p.price)}</div>
    </div>
    ${isRedBox?`<span class="pill pill-red">Bocor / Selisih</span>`:(auditSaved?`<span class="pill pill-green">Cocok</span>`:'')}
   </div>
   <div class="audit-metrics">
   <div class="audit-metric"><span>Stok awal</span><strong>${p.opening}</strong></div>
   <div class="audit-metric"><span>Barang masuk</span><strong>${p.incoming}</strong></div>
   <div class="audit-metric"><span>Checkout</span><strong>${p.posSold} unit</strong></div>
   </div>
   <div class="audit-input-wrap"><label for="audit-count-${p.id}">Sisa barang asli</label><input id="audit-count-${p.id}" class="audit-count" data-id="${p.id}" type="number" inputmode="numeric" min="0" max="${available}" step="1" value="${displayVal}" ${auditSaved?'disabled':''} onfocus="if(this.value==='0')this.select()" oninput="handleAuditInput(this)" /></div>
   <div class="audit-derived"><div>Terjual menurut stok<strong id="soldStock-${p.id}">${previewSold} unit</strong></div><div style="text-align:right">Nilai menurut stok<strong id="stockValue-${p.id}">${rupiah(previewSold*p.price)}</strong></div></div>
   ${isRedBox?`<div class="leak-badge-alert"><span>${leakText}</span><button type="button" class="btn btn-small btn-danger" onclick="showLeakDetailsModal()">Penjelasan</button></div>`:''}
   </article>`;
  }).join('');

  return `<div class="audit-cat-section">
   <div class="audit-cat-header">
    <span class="audit-cat-title"> Kategori: ${escHtml(group.category)}</span>
    <span class="audit-cat-badge">${group.items.length} barang</span>
   </div>
   <div class="audit-product-grid">${cardsHtml}</div>
  </div>`;
 }).join('') : `<div class="empty-state">Belum ada barang terdaftar.</div>`;

 const actionFooter=auditSaved
 ? `<div class="audit-action-note">Audit terkunci. Gunakan <strong>Mulai Hari / Shift Baru</strong> untuk ganti kasir hari berikutnya, atau <strong>Koreksi Audit Ini</strong> jika hanya ingin memperbaiki salah input angka malam ini.</div>${role==='admin'?`<div class="tag-row"><button class="btn btn-primary" onclick="startNewDayPrompt()">Mulai Hari / Shift Baru</button><button class="btn btn-danger" onclick="reopenAuditPrompt()">Koreksi Audit Ini</button></div>`:''}`
 : `<div class="audit-action-note">Periksa setiap jumlah sisa secara fisik per kategori sebelum menyimpan.</div><button class="btn btn-primary" onclick="saveAudit()">Simpan & kunci audit hari ini</button>`;

 return `${pageHead('Audit & Riwayat Harian','Hitung sisa fisik barang saat toko tutup. Urutan barang telah disesuaikan per kategori (A–Z).',actions)}${lockedNotice}<div class="audit-summary"><div class="audit-tile"><span>Checkout kasir shift ini</span><strong>${rupiah(posRevenue())}</strong><small>${posUnits()} unit tercatat di kasir</small></div><div class="audit-tile"><span>Estimasi penjualan dari stok</span><strong id="auditStockRev">${rupiah(previewStockRev)}</strong><small id="auditStockUnits">${previewStockUnits} unit berkurang (Acuan Setor)</small></div><div class="audit-tile"><span>Selisih / Bocor shift ini</span><strong id="auditDiff" style="color:${diff===0&&previewLeakingCount===0?'#10b981':'#f87171'}">${diff>0?'+':''}${rupiah(diff)}</strong><small id="auditHint">${diff===0&&previewLeakingCount===0?'Aman (Tidak ada bocor)':`${previewLeakingCount} jenis barang selisih`}</small></div></div><div id="auditResult" style="margin-bottom:17px">${auditSaved?auditResultHtml():''}</div><div class="simple-panel"><div class="panel-head"><div><h2>Hitung stok fisik (Urut per Kategori)</h2><div class="panel-sub">${auditSaved?'Mode terkunci — Kotak merah menandakan barang bocor / selisih':'Input sisa fisik saat tutup toko sesuai urutan kategori'}</div></div>${!auditSaved?`<button class="btn btn-small" onclick="resetAuditInputs()">Reset ke stok teori</button>`:''}</div>${groupedProductsHtml}<div class="audit-action-bar">${actionFooter}</div></div>`;
}

function auditResultHtml(){
 let d=variance();
 let unitDiff=stockUnits()-posUnits();
 let leakingItems=getLeakingProducts();
 let isClean=(d===0 && leakingItems.length===0);
 let title=isClean?'Aman: Penjualan dan stok cocok':`Ditemukan ${leakingItems.length} barang bocor / selisih pada shift ini`;
 return `<section class="panel"><div class="panel-head"><div><h2>Hasil audit · ${escHtml(lastAuditDate||today)}</h2><div class="panel-sub">${title} · Kasir: ${escHtml(auditOwner||'pengguna')}</div></div>${statusPill(isClean?'Aman (Cocok)':'Bocor / Selisih',isClean?'green':'red')}</div><div class="panel-body"><div class="reconcile-row"><span>Kasir yang mengaudit</span><strong>${escHtml(auditOwner||'Kasir')}</strong></div><div class="reconcile-row"><span>Selisih unit (stok - checkout)</span><strong>${unitDiff>0?'+':''}${unitDiff} unit (${leakingItems.length} jenis barang)</strong></div><div class="reconcile-row"><span>Nilai penjualan dari stok (Patokan Setor Uang)</span><strong>${rupiah(stockRevenue())}</strong></div><div class="reconcile-row"><span>Nilai checkout kasir</span><strong>${rupiah(posRevenue())}</strong></div><div class="reconcile-row"><span>Nominal Bocor / Selisih</span><div class="tag-row"><strong class="${isClean?'':'variance'}">${d>0?'+':''}${rupiah(d)}</strong><button type="button" class="btn btn-small ${isClean?'':'btn-danger'}" onclick="showLeakDetailsModal()"> Lihat Rincian & Penjelasan Bocor</button></div></div></div></section>`;
}

function showLeakDetailsModal(historyId){
 let items=[], titleDate=lastAuditDate||today, cashierName=auditOwner||(currentUser?.name||'Kasir'), totalDiff=variance();

 if(historyId){
  const rec=auditHistoryRecords().find(h=>h.id===historyId);
  if(rec){
   items=getProductsSortedByCategory(rec.leakItems||[]);
   titleDate=rec.date;
   cashierName=rec.cashier;
   totalDiff=rec.diff;
  }
 } else {
  items=getLeakingProducts().map(p=>({
   name:p.name,
   category:p.category,
   price:p.price,
   opening:p.opening,
   incoming:p.incoming,
   remaining:currentRemainingStock(p),
   soldStock:soldByStock(p),
   posSold:p.posSold,
   unitDiff:productUnitDiff(p),
   moneyDiff:productMoneyDiff(p)
  }));
 }

 if(!items.length){
  openModal('Rincian Audit Stok',`
   <div class="notice" style="background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.35)">
    <div><strong>Tidak ada kebocoran pada shift ini (${escHtml(titleDate)}).</strong><br>Seluruh stok fisik barang sesuai dengan jumlah yang di-checkout oleh kasir <strong>${escHtml(cashierName)}</strong>.</div>
   </div>
  `,`<button class="btn btn-primary" onclick="closeModal()">Tutup</button>`);
  return;
 }

 const listHtml = items.map(item=>{
  const isShortage = item.unitDiff > 0;
  const reasonHtml = isShortage
   ? `<strong>Kenapa bisa bocor (+${rupiah(item.moneyDiff)})?</strong><br>Stok fisik di etalase berkurang <strong>${item.soldStock} unit</strong> (Stok Awal+Masuk ${item.opening+item.incoming} dikurangi Sisa ${item.remaining}), tetapi kasir hanya mencatat checkout di aplikasi sebanyak <strong>${item.posSold} unit</strong>.<br><em>Penyebab: Ada <strong>${item.unitDiff} barang</strong> yang terjual/diambil pembeli namun kasir lupa menekan tombol Checkout di aplikasi, barang hilang, atau kasir salah menghitung sisa fisik terlalu sedikit. Uang yang wajib disetor tetap mengikuti fisik stok (${rupiah(item.soldStock*item.price)}).</em>`
   : `<strong>Kenapa bisa selisih lebih (${rupiah(item.moneyDiff)})?</strong><br>Kasir menekan checkout di aplikasi sebanyak <strong>${item.posSold} unit</strong>, tetapi stok fisik hanya berkurang <strong>${item.soldStock} unit</strong>.<br><em>Penyebab: Kasir kelebihan menekan item sebanyak <strong>${Math.abs(item.unitDiff)} unit</strong> saat transaksi di aplikasi, ada barang masuk yang belum ditambahkan ke menu Barang, atau salah hitung sisa fisik terlalu banyak.</em>`;

  return `<div class="leak-detail-card">
   <div class="leak-detail-head">
    <strong>${escHtml(item.name)} <span style="font-weight:400;color:#cbd5e1;font-size:12px">(${escHtml(item.category)})</span></strong>
    <span class="pill pill-red">${item.unitDiff>0?'Bocor +'+item.unitDiff+' unit':'Selisih '+item.unitDiff+' unit'} · ${item.moneyDiff>0?'+':''}${rupiah(item.moneyDiff)}</span>
   </div>
   <div class="leak-detail-stats">
    <div><span>Stok Awal+Masuk</span><b>${item.opening+item.incoming}</b></div>
    <div><span>Sisa Fisik</span><b>${item.remaining}</b></div>
    <div><span>Terjual Fisik vs Kasir</span><b>${item.soldStock} vs ${item.posSold}</b></div>
   </div>
   <div class="leak-detail-reason">${reasonHtml}</div>
  </div>`;
 }).join('');

 openModal(`Rincian Bocor / Selisih (${titleDate})`,`
  <div class="notice" style="margin-bottom:12px">
   <div>Kasir: <strong>${escHtml(cashierName)}</strong> · Ditemukan <strong>${items.length} barang</strong> tidak sinkron dengan total selisih bersih <strong>${totalDiff>0?'+':''}${rupiah(totalDiff)}</strong>.</div>
  </div>
  <div style="max-height:58vh;overflow-y:auto;padding-right:4px">${listHtml}</div>
 `,`<button class="btn btn-primary" onclick="closeModal()">Mengerti & Tutup</button>`);
}

function handleAuditInput(inp){
 if(auditSaved) return;
 const id = Number(inp.dataset.id);
 auditDrafts[id] = inp.value;
 updateAuditPreview();
}

function updateAuditPreview(){
 if(auditSaved)return;
 let total=0, units=0, leakingCount=0;
 document.querySelectorAll('.audit-count').forEach(inp=>{
  let p=products.find(x=>x.id===Number(inp.dataset.id));if(!p)return;
  const maxAvail = (Number(p.opening)||0) + (Number(p.incoming)||0);
  let raw=inp.value.trim();
  let count=raw===''?currentRemainingStock(p):Math.max(0,Math.min(maxAvail,Math.floor(Number(raw)||0)));
  auditDrafts[p.id]=inp.value;
  let sold=Math.max(0,maxAvail-count);
  let value=sold*p.price;
  total+=value;
  units+=sold;
  if(sold - (Number(p.posSold)||0) !== 0) leakingCount++;
  let sv=document.getElementById('soldStock-'+p.id),vv=document.getElementById('stockValue-'+p.id);
  if(sv)sv.textContent=sold+' unit';
  if(vv)vv.textContent=rupiah(value);
 });
 let diff=total-posRevenue();
 let rev=document.getElementById('auditStockRev'),un=document.getElementById('auditStockUnits'),df=document.getElementById('auditDiff'),hint=document.getElementById('auditHint');
 if(rev)rev.textContent=rupiah(total);
 if(un)un.textContent=units+' unit berkurang (Acuan Setor)';
 if(df){df.textContent=(diff>0?'+':'')+rupiah(diff);df.style.color=(diff===0&&leakingCount===0)?'#10b981':'#f87171'}
 if(hint)hint.textContent=(diff===0&&leakingCount===0)?'Aman (Tidak ada bocor)':`${leakingCount} jenis barang selisih`;
}

function processSingleRequestApproval(r){
 const qty = Math.max(1, getRequestQty(r));
 const cleanName = getCleanRequestName(r);
 const existing = findExistingProductByName(cleanName);

 if(existing){
  existing.incoming = (Number(existing.incoming)||0) + qty;
  existing.remaining = Math.max(0, (Number(existing.remaining)||0) + qty);
  if(Number(r.price) > 0) existing.price = Math.floor(Number(r.price));
  if(r.category) existing.category = r.category;
  delete auditDrafts[existing.id];
  return {isExisting:true, name:existing.name, qty, totalNow:currentRemainingStock(existing)};
 } else {
  const productId = Math.max(0,...products.map(p=>Number(p.id)||0)) + 1;
  const catName = r.category || (categories[0]?.name || 'Umum');
  if(catName && !categories.some(c=>c.name.toLowerCase()===catName.toLowerCase())){
   categories.push({name:catName, icon:''});
  }
  products.push({
   id:productId,
   name:cleanName,
   sku:'BRG-'+String(productId).padStart(4,'0'),
   category:catName,
   price:Math.max(0, Math.floor(Number(r.price)||0)),
   opening:qty,
   incoming:0,
   remaining:qty,
   posSold:0,
   archivedSold:0,
   icon:''
  });
  return {isExisting:false, name:cleanName, qty, totalNow:qty};
 }
}

let activeEditingRecapItems = [];

function getEditableShiftItemsForRecord(rec){
 let baseList = [];
 if(rec.allItems && rec.allItems.length){
  baseList = rec.allItems.map(it=>({...it}));
 } else {
  const leakMap = {};
  (rec.leakItems||[]).forEach(l=>{ leakMap[normalizeItemName(l.name)] = l; });
  baseList = products.map(p=>{
   const lk = leakMap[normalizeItemName(p.name)];
   if(lk) return {...lk};
   const openIn = (Number(p.opening)||0) + (Number(p.incoming)||0);
   const rem = currentRemainingStock(p);
   const sold = Math.max(0, openIn - rem);
   return {
    id:p.id,
    name:p.name,
    category:p.category,
    price:Number(p.price)||0,
    opening:Number(p.opening)||0,
    incoming:Number(p.incoming)||0,
    remaining:rem,
    soldStock:sold,
    posSold:sold,
    unitDiff:0,
    moneyDiff:0
   };
  });
 }
 return getProductsSortedByCategory(baseList);
}

function saveHistoryShiftRemaining(historyId){
 if(role!=='admin') return;
 const tx = transactions.find(t=>t && t.id===historyId);
 if(!tx){toast('Data rekapan tidak ditemukan.');return;}

 const rec = auditHistoryRecords().find(h=>h.id===historyId);
 const hadFullSnapshot = !!(rec && rec.allItems && rec.allItems.length);

 for(const inp of document.querySelectorAll('.recap-rem-input')){
  const idx = Number(inp.dataset.idx);
  const it = activeEditingRecapItems[idx];
  if(!it) continue;
  const maxAvail = (Number(it.opening)||0) + (Number(it.incoming)||0);
  const n = Number(inp.value);
  if(inp.value.trim()==='' || !Number.isInteger(n) || n < 0 || n > maxAvail){
   toast(`Sisa ${it.name} tidak valid (0 s/d ${maxAvail}).`);
   inp.focus();
   return;
  }
  it.remaining = n;
 }

 let deltaStockMoney = 0;
 let deltaUnits = 0;

 const updatedAll = activeEditingRecapItems.map((it)=>{
  const maxAvail = (Number(it.opening)||0) + (Number(it.incoming)||0);
  const oldSold = Number(it.soldStock)||0;
  const newSold = Math.max(0, maxAvail - it.remaining);
  const price = Number(it.price)||0;
  const posSold = Number(it.posSold)||0;
  const unitDiff = newSold - posSold;
  const moneyDiff = unitDiff * price;

  deltaUnits += (newSold - oldSold);
  deltaStockMoney += (newSold - oldSold) * price;

  return {
   ...it,
   soldStock:newSold,
   unitDiff,
   moneyDiff
  };
 });

 const updatedLeaks = updatedAll.filter(it=>it.unitDiff !== 0);
 const posVal = Number(tx.total)||0;
 const newStockVal = hadFullSnapshot
  ? updatedAll.reduce((s,it)=>s + it.soldStock * (Number(it.price)||0), 0)
  : Math.max(0, (Number(rec?.stock)||0) + deltaStockMoney);
 const newUnitsVal = hadFullSnapshot
  ? updatedAll.reduce((s,it)=>s + it.soldStock, 0)
  : Math.max(0, (Number(rec?.units)||0) + deltaUnits);
 const newDiffVal = newStockVal - posVal;

 const oldParts = String(tx.status||'').split('|');
 const note = oldParts[3] || '';
 const encodedLeaks = encodeURIComponent(JSON.stringify(updatedLeaks));
 const encodedAll = encodeURIComponent(JSON.stringify(updatedAll));

 tx.items = newUnitsVal;
 tx.status = `AUDIT|${newStockVal}|${newDiffVal}|${note}|${encodedLeaks}|${encodedAll}`;

 closeModal();
 render();
 toast('Sisa barang pada rekapan berhasil diperbarui.');
}

function triggerPdfDownload(doc, fileName, successMsg) {
  // Mengambil output Base64 Data URI sama seperti html2pdf.output('datauristring') di Absensi
  const pdfBase64 = doc.output('datauristring');

  // 1. Prioritas Utama: Konfigurasi APK Android WebView (Sama persis dengan Absensi MMU)
  if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.savePdf === 'function') {
    AndroidApp.savePdf(pdfBase64, fileName);
    toast(successMsg || 'Membuka PDF...');
    return;
  }

  // 2. Cadangan jika di APK lain menggunakan interface window.Android
  if (typeof window.Android !== 'undefined') {
    if (typeof window.Android.savePdf === 'function') {
      window.Android.savePdf(pdfBase64, fileName);
      toast(successMsg || 'Membuka PDF...');
      return;
    }
    if (typeof window.Android.downloadPdf === 'function') {
      window.Android.downloadPdf(pdfBase64, fileName);
      toast(successMsg || 'Mengunduh PDF...');
      return;
    }
  }

  // 3. Fallback untuk Browser (Chrome / Desktop / Mobile Browser)
  const link = document.createElement('a');
  link.href = pdfBase64;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  toast(successMsg || 'File PDF berhasil diunduh.');
}

function exportSalesPDF(){
 if(role!=='admin'){toast('Hanya admin yang dapat mengekspor laporan.');return;}
 const fmt=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
 const safeDate=String(today).replace(/[^a-zA-Z0-9_-]+/g,'_');
 const fileName=`Laporan_Penjualan_KANTIN_MMU_${safeDate}.pdf`;

 try {
  const jspdfLib = window.jspdf;

   toast('Memuat modul PDF, silakan klik sekali lagi.');
   return;
  }
  const doc = new jspdfLib.jsPDF({orientation:'p', unit:'mm', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 14;
  let y = 16;

  function checkPage(need){
   if(y + need > pageH - 14){
    doc.addPage();
    y = 16;
   }
  }

  doc.setFont('helvetica','bold');
  doc.setFontSize(15);

  doc.setDrawColor(23, 143, 131);
  doc.setLineWidth(0.6);
  doc.line(margin, y, pageW - margin, y);
  y += 7;

  let grandTotal = 0;
  let grandUnits = 0;

  const catNames = getAllCategoryNames();

  catNames.forEach(catName=>{
   const rows = products
    .filter(p=>(p.category||'Lainnya')===catName && cumulativeSoldUnits(p)>0)
    .slice()
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id',{sensitivity:'base'}));
   if(!rows.length && !categories.some(c=>c.name===catName)) return;

   const subtotal = rows.reduce((s,p)=>s + cumulativeSoldUnits(p)*p.price, 0);
   const units = rows.reduce((s,p)=>s + cumulativeSoldUnits(p), 0);
   grandTotal += subtotal;
   grandUnits += units;

   checkPage(24);
   doc.setFillColor(241, 246, 248);
   doc.rect(margin, y - 4.5, pageW - margin*2, 7.5, 'F');
   doc.setFont('helvetica','bold');
   doc.setFontSize(10.5);
   doc.setTextColor(20, 43, 74);
   doc.text(String(catName), margin + 2, y + 0.5);
   y += 7;

   doc.setFont('helvetica','bold');
   doc.setFontSize(8.5);
   doc.setTextColor(82, 102, 122);
   doc.text('NAMA BARANG', margin + 2, y);
   doc.text('TERJUAL (STOK)', margin + 96, y, {align:'center'});
   doc.text('HARGA', margin + 132, y, {align:'right'});
   doc.text('SUBTOTAL', pageW - margin - 2, y, {align:'right'});
   y += 2;
   doc.setDrawColor(220, 228, 235);
   doc.setLineWidth(0.25);
   doc.line(margin, y, pageW - margin, y);
   y += 4.5;

   doc.setFont('helvetica','normal');
   doc.setFontSize(9);

   if(!rows.length){
    checkPage(8);
    doc.setTextColor(135, 149, 165);
    doc.text('Tidak ada penjualan pada kategori ini.', margin + 2, y);
    y += 5.5;
   } else {
    rows.forEach(p=>{
     const soldQty = cumulativeSoldUnits(p);
     const nameLines = doc.splitTextToSize(String(p.name), 80);
     const rowH = Math.max(5.5, nameLines.length * 4.5 + 1.5);
     checkPage(rowH + 2);
     doc.setTextColor(30, 41, 59);
     doc.text(nameLines, margin + 2, y);
     doc.text(String(soldQty), margin + 96, y, {align:'center'});
     doc.text(fmt(p.price), margin + 132, y, {align:'right'});
     doc.text(fmt(soldQty * p.price), pageW - margin - 2, y, {align:'right'});
     y += rowH;
     doc.setDrawColor(235, 240, 245);
     doc.line(margin, y - 3, pageW - margin, y - 3);
    });
   }

   checkPage(10);
   doc.setFillColor(244, 250, 248);
   doc.rect(margin, y - 3.5, pageW - margin*2, 7, 'F');
   doc.setFont('helvetica','bold');
   doc.setFontSize(9.5);
   doc.setTextColor(8, 126, 120);
   doc.text(`Subtotal ${catName} (${units} unit)`, margin + 2, y + 1);
   doc.text(fmt(subtotal), pageW - margin - 2, y + 1, {align:'right'});
   y += 9;
  });

  checkPage(16);
  doc.setDrawColor(23, 143, 131);
  doc.setLineWidth(0.6);
  doc.rect(margin, y - 2, pageW - margin*2, 10);
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);

 let avail=Math.max(0,(Number(p.opening)||0)+(Number(p.incoming)||0)-(Number(p.posSold)||0));
 let next=c.qty+delta;
 if(next<=0)cart=cart.filter(x=>x.id!==id);
 else if(next>avail){toast('Melebihi stok tersedia.');return}
 else c.qty=next;
 render(true);
}
function clearCart(){cart=[];render(true);}
function checkout(){if(auditSaved||!cart.length)return;let total=cart.reduce((s,c)=>s+c.qty*c.price,0);let qty=cart.reduce((s,c)=>s+c.qty,0);openModal('Konfirmasi pembayaran',`<div class="reconcile-row"><span>Kasir</span><strong>${escHtml(currentUser?.name||'Kasir')}</strong></div><div class="reconcile-row"><span>Total kuantitas</span><strong>${qty} unit</strong></div><div class="reconcile-row"><span>Total bayar</span><strong style="font-size:20px;color:#10b981">${rupiah(total)}</strong></div>`, `<button class="btn" onclick="closeModal()">Kembali</button><button class="btn btn-primary" onclick="completeCheckout()">Bayar Sekarang</button>`)}

function generateNextTransactionId(){
 let maxNum = 190;
 regularTransactions().forEach(t=>{
  const m = String(t.id||'').match(/^TRX-(\d+)$/i);
  if(m && Number(m[1]) > maxNum) maxNum = Number(m[1]);
 });
 return 'TRX-' + String(maxNum + 1).padStart(4, '0');
}

function completeCheckout(){
 if(auditSaved || !cart.length)return;
 let total=cart.reduce((s,c)=>s+c.qty*c.price,0),qty=cart.reduce((s,c)=>s+c.qty,0);
 cart.forEach(c=>{
  let p=products.find(x=>x.id===c.id);
  if(p){
   p.posSold=(Number(p.posSold)||0)+c.qty;
   p.remaining=Math.max(0,(Number(p.remaining)||0)-c.qty);
   delete auditDrafts[p.id];
  }
 });
 transactions.unshift({
  id:generateNextTransactionId(),
  time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
  cashier:currentUser?.name||'Kasir',
  items:qty,
  total,
  status:'Selesai'
 });
 cart=[];auditSaved=false;closeModal();page='pos';render();toast('Transaksi berhasil dicatat.');
}

function onReqNameInput(inp){
 const card = inp.closest('.request-item-row');
 if(!card) return;
 const hint = card.querySelector('.existing-match-hint');
 const sugBox = card.querySelector('.suggest-chips');
 const catSelect = card.querySelector('.reqCategory');
 const priceInput = card.querySelector('.reqPrice');
 const qtyLabel = card.querySelector('.reqQtyLabel');
 const rowTitle = card.querySelector('.reqRowTitle');

 const rawVal = inp.value;
 const normVal = normalizeItemName(rawVal);
 const existing = findExistingProductByName(rawVal);

 if(existing){
  catSelect.value = existing.category;
  priceInput.value = existing.price;
  qtyLabel.textContent = 'Tambah jumlah stok (+Qty) *';
  rowTitle.innerHTML = ` Tambah Stok: <strong>${escHtml(existing.name)}</strong>`;
  hint.innerHTML = ` <strong>Barang sudah terdaftar!</strong> (${escHtml(existing.category)} · ${rupiah(existing.price)} · Sisa: <b>${currentRemainingStock(existing)}</b>). Otomatis menambah jumlah stok (+Qty) tanpa membuat barang baru.`;
  hint.classList.add('show');
  sugBox.classList.remove('show');
  sugBox.innerHTML = '';
  return;
 }

 qtyLabel.textContent = 'Jumlah stok diajukan *';
 rowTitle.textContent = 'Barang yang diajukan';
 hint.classList.remove('show');

 if(normVal.length >= 2){
  const matches = products.filter(p => normalizeItemName(p.name).includes(normVal)).slice(0, 3);
  if(matches.length > 0){
   sugBox.innerHTML = `<span class="suggest-chip-label">Barang yang sudah ada (sentuh jika ingin tambah stok):</span>` +
    matches.map(m=>`<button type="button" class="suggest-chip" onclick="selectSuggestedReqProduct(this, ${m.id})"><span>${escHtml(m.name)}</span><small>Sisa: ${currentRemainingStock(m)}</small></button>`).join('');
   sugBox.classList.add('show');
  } else {
   sugBox.classList.remove('show');
   sugBox.innerHTML = '';
  }
 } else {
  sugBox.classList.remove('show');
  sugBox.innerHTML = '';
 }
}

function newProductRequest(){
 if(!categories.length){toast('Admin perlu membuat kategori terlebih dahulu.');return;}
 openModal('Ajukan barang / Tambah stok',`
  <div class="notice" style="margin-bottom:12px">
   <div>Ketik nama barang seperti biasa. Jika nama barang sudah ada di kantin, sistem otomatis mendeteksinya sebagai <strong>Penambahan Stok (+Qty)</strong> agar tidak menjadi double.</div>
  </div>
  <div id="requestRows">${buildRequestItemCardHtml()}</div>
  <button type="button" class="btn" style="width:100%" onclick="addRequestRow()">+ Tambah baris barang</button>
 `,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitRequest()">Kirim pengajuan</button>`);

function addRequestRow(){
 const root=document.getElementById('requestRows');if(!root)return;
 const temp=document.createElement('div');
 temp.innerHTML=buildRequestItemCardHtml();
 root.appendChild(temp.firstElementChild);
}

function submitRequest(){
 const rows=[...document.querySelectorAll('.request-item-row')];if(!rows.length)return;
 const rawItems=[];

 for(const row of rows){
  const rawName = getCleanRequestName({name: row.querySelector('.reqName').value});
  const category = row.querySelector('.reqCategory').value;
  const price = Math.floor(Number(row.querySelector('.reqPrice').value));
  const qtyVal = Math.floor(Number(row.querySelector('.reqQty').value));

  if(!rawName || !Number.isFinite(price) || price < 1 || !Number.isFinite(qtyVal) || qtyVal < 1){
   toast('Lengkapi nama, harga, dan jumlah stok (minimal 1) pada semua baris.');
   return;
  }

  const existing = findExistingProductByName(rawName);
  rawItems.push({
   name: existing ? existing.name : rawName,
   category: existing ? existing.category : category,
   price: price > 0 ? price : (existing ? existing.price : price),
   quantity: qtyVal
  });
 }

 let addedCount = 0;
 let nextIdBase = Math.max(0,...requests.map(r=>Number(r.id)||0));
 const cashierName = currentUser?.name || 'Kasir';

 rawItems.forEach((item)=>{
  const existingPending = requests.find(r => r.status === 'Menunggu' && normalizeItemName(getCleanRequestName(r)) === normalizeItemName(item.name));
  if(existingPending){
   const cleanName = getCleanRequestName(existingPending);
   const cleanBy = getCleanRequestedBy(existingPending);
   const newQty = getRequestQty(existingPending) + item.quantity;
   existingPending.name = `${cleanName} [QTY:${newQty}]`;
   existingPending.category = item.category;
   existingPending.price = item.price;
   existingPending.quantity = newQty;
   existingPending.qty = newQty;
   existingPending.opening = newQty;
   existingPending.requestedBy = `${cleanBy} (Qty: ${newQty})`;
   addedCount++;
  } else {
   nextIdBase++;
   requests.unshift({
    id: nextIdBase,
    name: `${item.name} [QTY:${item.quantity}]`,
    category: item.category,
    price: item.price,
    quantity: item.quantity,
    qty: item.quantity,
    opening: item.quantity,
    requestedBy: `${cashierName} (Qty: ${item.quantity})`,
    date: new Date().toLocaleDateString('id-ID'),
    status: 'Menunggu'
   });
   addedCount++;
  }
 });

 closeModal();page='requests';render();
 toast(`Pengajuan berhasil dikirim (${addedCount} item).`);
}

function newProduct(){
 if(!categories.length){toast('Tambahkan kategori terlebih dahulu di menu Kategori.');return;}
 openModal('Tambah barang / Tambah stok',`
  <div class="field">
   <label>Nama barang *</label>
   <input id="prodName" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Ketik nama produk..." oninput="onAdminProdNameInput(this)" />
   <div id="adminProdSuggestChips" class="suggest-chips"></div>
   <div id="adminProdMatchHint" class="existing-match-hint"></div>
  </div>
  <div class="field"><label>Kategori *</label><select id="prodCategory">${categories.map(c=>`<option value="${escHtml(c.name)}">${escHtml(c.name)}</option>`).join('')}</select></div>
  <div class="field"><label>Harga jual (Rp) *</label><input id="prodPrice" type="number" inputmode="numeric" min="1" placeholder="5000" /></div>
  <div class="field"><label id="prodOpeningLabel">Stok awal hari ini *</label><input id="prodOpening" type="number" inputmode="numeric" min="1" placeholder="Contoh: 10" value="" oninput="const r=document.getElementById('prodRemaining');if(r)r.value=this.value" /></div>
  <div class="field" id="prodRemainingWrap"><label>Stok sisa fisik saat ini</label><input id="prodRemaining" type="number" inputmode="numeric" min="0" value="0" /></div>
 `,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveNewProduct()">Simpan barang</button>`);
}

function saveNewProduct(){
 let rawName=getCleanRequestName({name: document.getElementById('prodName').value}),
     category=document.getElementById('prodCategory').value,
     price=Math.floor(Number(document.getElementById('prodPrice').value)||0),
     qtyInput=Math.max(0,Math.floor(Number(document.getElementById('prodOpening').value)||0)),
     remainingInput=document.getElementById('prodRemaining').value;

 if(!rawName||!Number.isFinite(price)||price<=0||qtyInput<=0){
  toast('Nama, harga, dan jumlah stok (minimal 1) wajib diisi.');
  return;
 }

 const existing = findExistingProductByName(rawName);
 if(existing){
  existing.category = category;
  existing.price = price;
  existing.incoming = (Number(existing.incoming)||0) + qtyInput;
  existing.remaining = Math.max(0, (Number(existing.remaining)||0) + qtyInput);
  delete auditDrafts[existing.id];
  closeModal();render();
  toast(`Barang sudah ada: Stok "${existing.name}" berhasil ditambah +${qtyInput} unit (Sisa: ${currentRemainingStock(existing)}).`);
  return;
 }

 let id=Math.max(0,...products.map(p=>Number(p.id)||0))+1,
     sku='BRG-'+String(id).padStart(4,'0'),
     remaining=remainingInput===''?qtyInput:Math.max(0,Math.min(qtyInput,Math.floor(Number(remainingInput)||0)));

 products.push({id,name:rawName,sku,category,price,opening:qtyInput,incoming:0,remaining,posSold:0,archivedSold:0,icon:''});
 closeModal();render();toast(`Barang baru "${rawName}" ditambahkan (${qtyInput} unit).`);
}

function deleteProductPrompt(id){if(role!=='admin')return;const p=products.find(x=>x.id===id);if(!p)return;openModal('Hapus barang',`<p>Yakin menghapus <strong>${escHtml(p.name)}</strong>?</p>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-danger" onclick="deleteProduct(${id})">Hapus</button>`)}
function deleteProduct(id){if(role!=='admin')return;products=products.filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);delete auditDrafts[id];closeModal();render();toast('Barang dihapus.')}

function editProduct(id){
 let p=products.find(x=>x.id===id);if(!p)return;
 const allCatNames=getAllCategoryNames();
 openModal('Edit barang',`<div class="field"><label>Nama barang</label><input id="editName" value="${escHtml(p.name)}" /></div><div class="field"><label>Kategori</label><select id="editCategory">${allCatNames.map(cName=>`<option value="${escHtml(cName)}" ${p.category===cName?'selected':''}>${escHtml(cName)}</option>`).join('')}</select></div><div class="field"><label>Harga jual (Rp)</label><input id="editPrice" type="number" min="1" value="${p.price}" /></div><div class="field"><label>Stok awal</label><input id="editOpening" type="number" min="0" value="${p.opening}" /></div><div class="field"><label>Barang masuk hari ini</label><input id="editIncoming" type="number" min="0" value="${p.incoming}" /></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveEditProduct(${id})">Simpan</button>`);
}

function saveEditProduct(id){
 let p=products.find(x=>x.id===id);if(!p)return;
 let name=getCleanRequestName({name: document.getElementById('editName').value}),
     price=Math.floor(Number(document.getElementById('editPrice').value)||0);
 if(!name||!Number.isFinite(price)||price<=0){toast('Nama dan harga barang tidak valid.');return;}
 const duplicate = findExistingProductByName(name, id);
 if(duplicate){
  toast(`Nama barang "${name}" sudah dipakai oleh produk lain.`);
  return;
 }
 const oldTotal = (Number(p.opening)||0) + (Number(p.incoming)||0);
 const newOpening = Math.max(0,Math.floor(Number(document.getElementById('editOpening').value)||0));
 const newIncoming = Math.max(0,Math.floor(Number(document.getElementById('editIncoming').value)||0));
 const deltaStock = (newOpening + newIncoming) - oldTotal;
 p.name=name;p.category=document.getElementById('editCategory').value;p.price=price;
 p.opening=newOpening;p.incoming=newIncoming;
 p.remaining=Math.max(0, Math.min(newOpening + newIncoming, (Number(p.remaining)||0)+deltaStock));
 delete auditDrafts[p.id];
 closeModal();render();toast('Data diperbarui.');
}

function newCategory(){openModal('Tambah kategori',`<div class="field"><label>Nama kategori *</label><input id="catName" placeholder="Contoh: Jualan Kategori" /></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveCategory()">Tambah</button>`)}
function saveCategory(){let name=document.getElementById('catName').value.trim();if(!name)return;if(categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast('Kategori sudah ada.');return}categories.push({name,icon:''});closeModal();render();toast('Kategori ditambahkan.')}

function editCategoryByIndex(idx){
 let c=categories[idx];if(!c)return;
 openModal('Ubah kategori',`<div class="field"><label>Nama kategori</label><input id="editCatName" value="${escHtml(c.name)}" /></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveEditCategoryByIndex(${idx})">Simpan</button>`);
}
function saveEditCategoryByIndex(idx){
 let c=categories[idx];if(!c)return;
 const oldName = c.name;
 let n=document.getElementById('editCatName').value.trim();
 if(!n)return;
 if(categories.some((cat, i)=>i!==idx && cat.name.toLowerCase()===n.toLowerCase())){
  toast('Nama kategori sudah ada.');
  return;
 }
 products.forEach(p=>{if(p.category===oldName)p.category=n});
 requests.forEach(r=>{if(r.category===oldName)r.category=n});
 if(categoryFilter===oldName) categoryFilter=n;
 c.name=n;
 closeModal();render();toast('Kategori diperbarui.');
}
function deleteCategoryByIndex(idx){
 if(role!=='admin')return;
 const c=categories[idx];if(!c)return;
 const usedCount=products.filter(p=>p.category===c.name).length;
 if(usedCount>0){
  toast(`Kategori "${c.name}" masih digunakan oleh ${usedCount} barang. Pindahkan atau hapus barangnya terlebih dahulu.`);
  return;
 }
 categories.splice(idx,1);
 if(categoryFilter===c.name) categoryFilter='Semua kategori';
 render();
 toast('Kategori dihapus.');
}

function newUser(){openModal('Tambah kasir',`<div class="field"><label>Nama kasir *</label><input id="userName" placeholder="Contoh: Amil/Isvi" autocomplete="off" /></div><div class="field"><label>Kata sandi *</label><input id="userPassword" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password" /></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveUser()">Tambah kasir</button>`)}
function saveUser(){let name=document.getElementById('userName').value.trim(),pass=document.getElementById('userPassword').value;if(!name||pass.length<6){toast('Isi nama dan sandi minimal 6 karakter.');return}if(users.some(u=>u.name.toLowerCase()===name.toLowerCase())){toast('Nama sudah terdaftar.');return}users.push({id:Math.max(0,...users.map(u=>u.id||0))+1,name,role:'Kasir',status:'Aktif',password:pass});closeModal();renderLoginUsers();render();toast('Kasir ditambahkan.');}
function changePasswordModal(){if(role!=='admin')return;openModal('Ganti password admin',`<div class="field"><label>Password saat ini</label><input id="oldAdminPassword" type="password"></div><div class="field"><label>Password baru (min 8 karakter)</label><input id="newAdminPassword" type="password"></div><div class="field"><label>Ulangi password baru</label><input id="confirmAdminPassword" type="password"></div>`,`<button class="btn" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="submitAdminPasswordChange()">Simpan</button>`);}
function submitAdminPasswordChange(){const oldP=document.getElementById('oldAdminPassword').value,newP=document.getElementById('newAdminPassword').value,confirmP=document.getElementById('confirmAdminPassword').value;if(newP.length<8||newP!==confirmP){toast('Periksa kembali password baru.');return;}google.script.run.withSuccessHandler(res=>{if(!res||!res.ok){toast((res&&res.message)||'Gagal.');return;}closeModal();toast('Password berhasil diganti.');}).withFailureHandler(err=>toast('Error: '+(err.message||err))).changeAdminPassword(oldP,newP);}
function toggleUser(i){if(!users[i]||users[i].role!=='Kasir')return;users[i].status=users[i].status==='Aktif'?'Nonaktif':'Aktif';renderLoginUsers();render();toast('Status diperbarui.')}
