<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KANTIN HASIL JUAL</title>
  <link rel="icon" href="https://iili.io/fGkfBfV.png" />
  <!-- Masukkan kode frontend lengkap Anda di sini, atau muat file frontend Anda -->
</head>
<body>
  <!-- Tempat konten aplikasi Anda -->

  <script>
    // URL Web App Google Apps Script Anda (berakhiran /exec)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw6QStRznf5FIEcvHJn_GIRkKxx0-eN_jEPX0RyF3dq32J5GkpMRHJ93pMAvq0ElMH20Q/exec";

    // Jembatan Otomatis: Mengubah google.script.run menjadi fetch() ke Google Sheets
    if (typeof google === 'undefined' || !google.script) {
      window.google = {
        script: {
          run: (function() {
            function createRunner(onSuccess, onFailure) {
              return new Proxy({}, {
                get: function(_, funcName) {
                  if (funcName === 'withSuccessHandler') {
                    return function(cb) { return createRunner(cb, onFailure); };
                  }
                  if (funcName === 'withFailureHandler') {
                    return function(cb) { return createRunner(onSuccess, cb); };
                  }
                  return function(...args) {
                    fetch(GAS_API_URL + "?t=" + Date.now(), {
                      method: 'POST',
                      cache: 'no-store',
                      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                      body: JSON.stringify({ action: funcName, args: args })
                    })
                    .then(res => res.json())
                    .then(res => {
                      if (res.status === 'ok') {
                        if (onSuccess) onSuccess(res.data);
                      } else {
                        if (onFailure) onFailure(new Error(res.message));
                      }
                    })
                    .catch(err => {
                      if (onFailure) onFailure(err);
                    });
                  };
                }
              });
            }
            return createRunner(null, null);
          })()
        }
      };
    }
  </script>
</body>
</html>
